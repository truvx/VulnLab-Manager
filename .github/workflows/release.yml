name: Build installers and publish GitHub Release

# Releases are published manually from Actions -> Run workflow.
# GitHub requires every Release to point at a tag; softprops/action-gh-release
# creates that version tag automatically from the selected branch commit.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example 0.4.0)
        required: true
        default: 0.4.0
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  macos-arm64:
    name: macOS Apple Silicon (DMG + ZIP)
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Apple Silicon installer
        run: npm run package:mac:arm64
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error
          retention-days: 14

  windows-arm64:
    name: Windows ARM64 (NSIS EXE)
    runs-on: windows-11-arm
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Windows ARM64 installer
        run: npm run package:win:arm64
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-arm64
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish release assets
    runs-on: ubuntu-latest
    needs: [macos-arm64, windows-arm64]
    steps:
      - name: Download platform installers
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
      - name: Remove a stale version tag when it points at an older commit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: v${{ inputs.version }}
          TARGET_SHA: ${{ github.sha }}
        shell: bash
        run: |
          get_ref="repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG_NAME}"
          delete_ref="repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG_NAME}"
          if current_sha="$(gh api "${get_ref}" --jq '.object.sha' 2>/dev/null)"; then
            if [ "${current_sha}" != "${TARGET_SHA}" ]; then
              echo "Removing stale ${TAG_NAME} reference (${current_sha})"
              gh api --method DELETE "${delete_ref}"
            else
              echo "${TAG_NAME} already points to the selected source commit"
            fi
          else
            echo "No existing ${TAG_NAME} reference; the release action will create it"
          fi
      - name: Create GitHub Release and attach installers
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          name: VulnLab Manager v${{ inputs.version }}
          generate_release_notes: true
          files: release-assets/*
          fail_on_unmatched_files: true
