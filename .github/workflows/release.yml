name: Build installers and publish GitHub Release

# Releases are published manually from Actions -> Run workflow.
# GitHub requires every Release to point at a tag; softprops/action-gh-release
# creates that version tag automatically from the selected branch commit.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example 0.4.0)
        required: true
        default: 0.5.0
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  macos-arm64:
    name: macOS Apple Silicon (DMG + ZIP)
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Apple Silicon installer with bundled QEMU
        run: npm run package:mac:arm64
      - name: Smoke-test QEMU inside the packaged macOS app
        shell: bash
        run: |
          set -euo pipefail
          qemu_bin="$(find release -path '*/Contents/Resources/qemu/bin/qemu-system-x86_64' -type f -print -quit)"
          test -n "$qemu_bin"
          qemu_dir="$(dirname "$qemu_bin")"
          export DYLD_LIBRARY_PATH="$qemu_dir/../lib"
          export QEMU_MODULE_DIR="$qemu_dir/../lib/qemu"
          "$qemu_bin" --version | grep -F '11.1.3'
          "$qemu_dir/qemu-system-i386" --version | grep -F '11.1.3'
          "$qemu_dir/qemu-img" --version | grep -F '11.1.3'
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error
          retention-days: 14

  windows-arm64:
    name: Windows ARM64 (NSIS EXE)
    runs-on: windows-11-arm
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Set up native MSYS2 CLANGARM64 QEMU packages
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          release: false
          update: true
          install: >-
            binutils
            mingw-w64-clang-aarch64-qemu
            mingw-w64-clang-aarch64-qemu-common
            mingw-w64-clang-aarch64-qemu-image-util
            mingw-w64-clang-aarch64-llvm-tools
      - name: Build Windows ARM64 installer with bundled QEMU
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: npm run package:win:arm64
      - name: Smoke-test QEMU inside the packaged Windows app
        shell: pwsh
        run: |
          $qemuRoot = Join-Path $PWD 'release\win-arm64-unpacked\resources\qemu'
          $qemuBin = Join-Path $qemuRoot 'bin'
          foreach ($tool in @('qemu-system-x86_64.exe', 'qemu-system-i386.exe', 'qemu-img.exe')) {
            $toolPath = Join-Path $qemuBin $tool
            if (-not (Test-Path $toolPath)) { throw "Bundled app resource is missing $toolPath" }
            $output = (& $toolPath --version 2>&1 | Out-String)
            if ($LASTEXITCODE -ne 0 -or $output -notmatch '11\.1\.3') {
              throw "Packaged QEMU smoke test failed for $tool. Output: $output"
            }
          }
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-arm64
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish release assets
    runs-on: ubuntu-latest
    needs: [macos-arm64, windows-arm64]
    steps:
      - name: Download platform installers
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Download corresponding QEMU source archives
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://download.qemu.org/qemu-11.1.3.tar.xz -o release-assets/qemu-11.1.3.tar.xz
          curl --fail --location --retry 3 https://download.qemu.org/qemu-11.1.3.tar.xz.sig -o release-assets/qemu-11.1.3.tar.xz.sig
          curl --fail --location --retry 3 https://mirror.msys2.org/mingw/sources/mingw-w64-qemu-11.1.3-2.src.tar.zst -o release-assets/mingw-w64-qemu-11.1.3-2.src.tar.zst
      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
      - name: Remove a stale version tag when it points at an older commit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: v${{ inputs.version }}
          TARGET_SHA: ${{ github.sha }}
        shell: bash
        run: |
          get_ref="repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG_NAME}"
          delete_ref="repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG_NAME}"
          if current_sha="$(gh api "${get_ref}" --jq '.object.sha' 2>/dev/null)"; then
            if [ "${current_sha}" != "${TARGET_SHA}" ]; then
              echo "Removing stale ${TAG_NAME} reference (${current_sha})"
              gh api --method DELETE "${delete_ref}"
            else
              echo "${TAG_NAME} already points to the selected source commit"
            fi
          else
            echo "No existing ${TAG_NAME} reference; the release action will create it"
          fi
      - name: Create GitHub Release and attach installers
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          name: VulnLab Manager v${{ inputs.version }}
          generate_release_notes: true
          files: release-assets/*
          fail_on_unmatched_files: true
