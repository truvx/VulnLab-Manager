name: Bug report
description: Report a reproducible VulnLab Manager issue.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please do not attach proprietary VM images, credentials, or private machine data.
  - type: input
    id: version
    attributes:
      label: VulnLab Manager version
      placeholder: 0.4.0
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Host platform
      options:
        - macOS Apple Silicon
        - Windows 11 ARM64
        - Other (describe below)
    validations:
      required: true
  - type: input
    id: qemu
    attributes:
      label: QEMU version
      placeholder: qemu-system-x86_64 --version
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the smallest set of steps that reliably reproduces the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and relevant logs
    validations:
      required: true
